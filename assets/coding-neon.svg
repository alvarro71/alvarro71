<svg xmlns="http://www.w3.org/2000/svg" width="210" height="190" viewBox="0 0 210 190" role="img" aria-label="alvarro71 coding setup">
  <defs>
    <radialGradient id="halo" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#3dfc89" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3dfc89" stop-opacity="0"/>
    </radialGradient>
    <style>
      .floatBox { animation: fb 3.8s ease-in-out infinite; }
      .blinkCur { animation: bc 1.1s step-end infinite; }
      .pulseBar { animation: pb 2.8s ease-in-out infinite; }
      @keyframes fb { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
      @keyframes bc { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes pb { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    </style>
  </defs>

  <circle cx="105" cy="92" r="88" fill="url(#halo)"/>

  <g class="floatBox">
    <!-- Monitor frame -->
    <rect x="26" y="28" width="158" height="104" rx="11" fill="#06120a" stroke="#3dfc89" stroke-width="2.2"/>
    <!-- Top bar -->
    <line x1="27" y1="48" x2="183" y2="48" stroke="#1f3327" stroke-width="1.5"/>
    <circle cx="42" cy="38" r="3.5" fill="#ff5f56"/>
    <circle cx="54" cy="38" r="3.5" fill="#ffbd2e"/>
    <circle cx="66" cy="38" r="3.5" fill="#3dfc89"/>
    <text x="172" y="42" text-anchor="end" font-family="monospace" font-size="9" fill="#8b949e">garuda</text>

    <!-- Code lines -->
    <rect x="40" y="60" width="54" height="6" rx="3" fill="#3dfc89"/>
    <rect x="100" y="60" width="38" height="6" rx="3" fill="#4dffe8" opacity="0.8"/>

    <rect x="50" y="74" width="84" height="5" rx="2.5" fill="#a855f7" opacity="0.85"/>
    <rect x="50" y="86" width="66" height="5" rx="2.5" fill="#3dfc89" class="pulseBar"/>
    <rect x="122" y="86" width="28" height="5" rx="2.5" fill="#ffdb4d" opacity="0.85"/>

    <rect x="50" y="98" width="44" height="5" rx="2.5" fill="#4dffe8" opacity="0.75"/>
    <rect x="100" y="98" width="48" height="5" rx="2.5" fill="#3dfc89" opacity="0.5"/>

    <!-- Terminal prompt & blinking cursor -->
    <text x="40" y="121" font-family="monospace" font-size="10.5" font-weight="700" fill="#3dfc89">&gt; build()</text>
    <rect class="blinkCur" x="98" y="112" width="6" height="11" rx="1" fill="#3dfc89"/>

    <!-- Monitor stand -->
    <rect x="92" y="132" width="26" height="14" rx="2" fill="#1f3327"/>
    <rect x="66" y="144" width="78" height="8" rx="4" fill="#30363d" stroke="#3dfc89" stroke-opacity="0.35" stroke-width="1"/>

    <!-- Subtle caption -->
    <text x="105" y="172" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#3dfc89" opacity="0.9">coding @ alvarro71</text>
  </g>
</svg>
